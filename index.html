<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古風動畫集・土地受餓／自污救人</title>
<!-- 字體：fontsource CDN -->
<link href="https://cdn.jsdelivr.net/npm/@fontsource/ma-shan-zheng@5/index.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-tc@5/index.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/index.css" rel="stylesheet">
<style>
:root{
  --paper:#f7f1e3; --paper2:#efe5cd; --ink:#33281a; --ink-soft:#6b5a3a;
  --gold:#b8933f; --gold-dim:#9a7a3a; --line:#d8c8a2;
  --vermilion:#b03a28; --ctrlH:64px;
  --rollerW:30px;
}
@media (max-width:760px){ :root{--ctrlH:112px; --rollerW:18px} }
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:radial-gradient(1200px 700px at 50% 30%, #fdfaf1, #efe4cd);
  font-family:'Noto Serif TC','Noto Serif SC',serif;
  color:var(--ink); overflow:hidden; display:flex; flex-direction:column;
}
header{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 22px; background:linear-gradient(#fbf7ec,#f1e8d4);
  border-bottom:1px solid var(--line); flex:0 0 auto; z-index:30;
  box-shadow:0 4px 14px rgba(120,90,40,.08);
}
.brand{display:flex; align-items:center; gap:12px}
.brand .seal{
  width:34px;height:34px;border-radius:6px;background:var(--vermilion);
  display:flex;align-items:center;justify-content:center;
  font-family:'Ma Shan Zheng',serif;color:#fdf3dd;font-size:15px;line-height:1;
  box-shadow:inset 0 0 6px rgba(0,0,0,.25), 0 2px 6px rgba(176,58,40,.35); writing-mode:vertical-rl;
}
.brand h1{font-family:'Ma Shan Zheng',serif;font-weight:400;font-size:22px;color:#3a2c18;letter-spacing:4px}
.brand small{color:var(--gold-dim);font-size:12px;letter-spacing:2px}
#progressWrap{position:absolute;left:0;right:0;top:0;height:3px;background:#e6d9ba;z-index:40}
#progressBar{height:100%;width:0;background:linear-gradient(90deg,var(--gold-dim),#d9b45e);transition:width .8s ease}

#stageWrap{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:22px 18px;min-height:0}

/* ============ 卷軸裝裱 ============ */
.scrollWrap{
  position:relative;
  width:min(100%, calc((100vh - 265px) * 16 / 9 + var(--rollerW)*2 + 52px));
}
.mount{
  margin:0 calc(var(--rollerW) + 8px);
  padding:12px;border-radius:6px;
  background:
    repeating-linear-gradient(135deg, rgba(255,222,150,.09) 0 2px, transparent 2px 9px),
    linear-gradient(#7c3322,#5e2416);
  border:2px solid #c9a25a;
  box-shadow:0 24px 60px rgba(110,80,35,.35), inset 0 0 0 3px rgba(255,225,160,.18);
}
#scrollTag{
  position:absolute;left:calc(var(--rollerW) + 22px);top:26px;z-index:15;
  writing-mode:vertical-rl;letter-spacing:6px;
  font-family:'Ma Shan Zheng',serif;font-size:17px;color:#f6ead0;
  background:linear-gradient(#8d3423,#6d2416);border:1px solid #d18a5e;
  padding:14px 7px;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.3);
}
/* 木軸 */
.roller{
  position:absolute;top:-16px;bottom:-16px;width:var(--rollerW);z-index:14;
  border-radius:calc(var(--rollerW)/2);
  background:linear-gradient(90deg,#4e3018,#93643a 42%,#3a2412 90%);
  box-shadow:2px 4px 12px rgba(70,45,15,.45), inset 0 0 4px rgba(255,220,160,.25);
}
.roller.left{left:0}
.roller.right{right:0}
.roller::before,.roller::after{
  content:"";position:absolute;left:50%;transform:translateX(-50%);
  width:calc(var(--rollerW)*.78);height:calc(var(--rollerW)*.78);border-radius:50%;
  background:radial-gradient(circle at 35% 32%, #f0d07a, #9a7a34 68%, #5c431c);
  box-shadow:0 3px 8px rgba(0,0,0,.4);
}
.roller::before{top:calc(var(--rollerW)*-.42)}
.roller::after{bottom:calc(var(--rollerW)*-.42)}
/* 展卷動畫 */
.scrollWrap.unroll #stage{animation:unrollClip 1.7s cubic-bezier(.22,.8,.3,1) both}
.scrollWrap.unroll .roller.left{animation:rollL 1.7s cubic-bezier(.22,.8,.3,1) both}
.scrollWrap.unroll .roller.right{animation:rollR 1.7s cubic-bezier(.22,.8,.3,1) both}
@keyframes unrollClip{from{clip-path:inset(-20px 49.8% -20px 49.8%)}to{clip-path:inset(-20px 0 -20px 0)}}
@keyframes rollL{from{left:calc(50% - var(--rollerW)/2)}to{left:0}}
@keyframes rollR{from{right:calc(50% - var(--rollerW)/2)}to{right:0}}

#stage{
  position:relative;width:100%;aspect-ratio:16/9;
  background:var(--paper2);border:1px solid #c9b17e;border-radius:4px;overflow:hidden;
  box-shadow:inset 0 0 0 5px rgba(201,162,75,.14);
}
.art{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease;pointer-events:none}
.art.on{opacity:1}
.art svg{width:100%;height:100%;display:block;animation:breathe 22s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.06)}}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 58%, rgba(70,55,25,.26) 100%);}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.45;mix-blend-mode:multiply;
  background-image:repeating-conic-gradient(rgba(120,95,50,.02) 0 .0005turn, transparent .0005turn .001turn);}

#chapterChip{
  position:absolute;top:16px;right:18px;z-index:8;
  background:rgba(252,248,238,.88);border:1px solid #cdb57e;border-radius:999px;
  padding:6px 16px;font-size:14px;letter-spacing:3px;color:#5a4326;backdrop-filter:blur(4px);
  display:flex;gap:8px;align-items:center;box-shadow:0 3px 10px rgba(120,90,40,.18);
}
#chapterChip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--vermilion);box-shadow:0 0 8px rgba(176,58,40,.6)}

#subs{
  position:absolute;left:0;right:0;
  bottom:calc(var(--ctrlH) + 40px);
  z-index:9;padding:36px 6% 14px;text-align:center;pointer-events:none;
  background:linear-gradient(rgba(250,246,236,0), rgba(250,246,236,.62) 35%, rgba(248,242,228,.92));
}
#origLine{font-size:clamp(12px,1.5vw,17px);color:var(--gold-dim);letter-spacing:2px;margin-bottom:8px;opacity:.95}
#narrLine{font-size:clamp(15px,2.1vw,24px);color:#33281a;letter-spacing:1.5px;line-height:1.75;
  text-shadow:0 1px 0 rgba(255,252,242,.7);max-width:88%;margin:0 auto}
.subIn #origLine,.subIn #narrLine{animation:subUp .9s ease both}
.subIn #narrLine{animation-delay:.15s}
@keyframes subUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
body.noSubs #subs{display:none}

#dots{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(var(--ctrlH) + 12px);z-index:12;display:flex;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#d9c99e;cursor:pointer;transition:.3s;border:1px solid #b9a678}
.dot.on{background:var(--vermilion);box-shadow:0 0 8px rgba(176,58,40,.55);transform:scale(1.25)}

#controls{position:absolute;left:0;right:0;bottom:0;z-index:11;
  min-height:var(--ctrlH);
  display:flex;align-items:center;justify-content:center;align-content:center;
  gap:10px;padding:10px 12px;background:rgba(251,247,238,.94);border-top:1px solid var(--line);
  backdrop-filter:blur(6px);flex-wrap:wrap}
.btn{
  font-family:'Noto Serif TC',serif;background:#fbf6ea;color:#5a4a2c;border:1px solid #cbb88c;
  border-radius:8px;padding:7px 14px;font-size:14px;letter-spacing:2px;cursor:pointer;transition:.25s;
  box-shadow:0 2px 6px rgba(120,90,40,.1);
}
.btn:hover{background:#f5ecd6;border-color:var(--gold);color:#3a2c18;transform:translateY(-1px);
  box-shadow:0 4px 10px rgba(120,90,40,.18)}
.btn.primary{background:linear-gradient(#c14a32,#9c3222);border-color:#d16a4e;color:#fff3e0;min-width:88px;
  box-shadow:0 4px 12px rgba(176,58,40,.3)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.tog.on{background:#f3e6c2;border-color:var(--gold);color:#6b4f1c}
.btn.tog:not(.on){opacity:.45}
.sep{width:1px;height:22px;background:#d3c298}

/* 覆蓋層（明亮） */
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:rgba(251,247,238,.88);backdrop-filter:blur(6px);opacity:1;transition:opacity .6s;overflow-y:auto}
.overlay.hidden{opacity:0;pointer-events:none}
.card{text-align:center;padding:40px 50px;max-width:640px}
.card h2{font-family:'Ma Shan Zheng',serif;font-size:52px;color:#3a2c18;letter-spacing:14px;font-weight:400}
.card .sub{color:var(--gold-dim);letter-spacing:5px;margin:10px 0 26px;font-size:15px}
.card p{color:var(--ink-soft);line-height:2;font-size:14px;letter-spacing:1px}
.bigPlay{
  margin-top:28px;font-family:'Ma Shan Zheng',serif;font-size:24px;letter-spacing:8px;
  background:linear-gradient(#c14a32,#9c3222);color:#fff3e0;border:1px solid #d16a4e;
  border-radius:999px;padding:14px 46px;cursor:pointer;transition:.3s;box-shadow:0 8px 26px rgba(176,58,40,.3);
}
.bigPlay:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 12px 36px rgba(176,58,40,.42)}
.endBtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}

/* 選篇畫面 */
.pickWrap{text-align:center;max-width:920px;padding:28px 20px;margin:auto}
.pickTitle{font-family:'Ma Shan Zheng',serif;font-size:46px;color:#3a2c18;letter-spacing:12px;font-weight:400}
.pickSub{color:var(--gold-dim);margin:10px 0 28px;letter-spacing:4px;font-size:14px}
.pickCards{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
.pickCard{
  width:350px;background:linear-gradient(#fffdf6,#f6efdc);border:1px solid #d8c49a;border-radius:12px;
  padding:28px 26px;text-align:left;transition:.3s;display:flex;flex-direction:column;
  box-shadow:0 8px 22px rgba(120,90,40,.12);
}
.pickCard:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 16px 34px rgba(120,90,40,.2)}
.pickCard h3{font-family:'Ma Shan Zheng',serif;font-size:36px;color:#3a2c18;letter-spacing:6px;font-weight:400}
.pickCard .src{color:var(--gold-dim);font-size:13px;letter-spacing:2px;margin:6px 0 14px}
.pickCard p{color:var(--ink-soft);font-size:13.5px;line-height:2;margin-bottom:18px;flex:1}
.pickCard button{
  font-family:'Ma Shan Zheng',serif;font-size:19px;letter-spacing:6px;width:100%;
  background:linear-gradient(#c14a32,#9c3222);color:#fff3e0;border:1px solid #d16a4e;
  border-radius:999px;padding:11px 0;cursor:pointer;transition:.3s;box-shadow:0 6px 16px rgba(176,58,40,.25);
}
.pickCard button:hover{filter:brightness(1.08);transform:translateY(-1px)}

/* 文本 modal */
#modal{position:absolute;inset:0;z-index:25;background:rgba(240,232,212,.88);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:30px}
#modal.show{display:flex}
#modalBox{background:linear-gradient(#f6efd9,#ece0bf);color:#33291a;border-radius:12px;max-width:760px;width:100%;
  max-height:88%;overflow-y:auto;padding:34px 40px;border:6px solid #b89a5e;box-shadow:0 30px 80px rgba(120,90,40,.35)}
#modalBox h3{font-family:'Ma Shan Zheng',serif;font-size:30px;color:#8d3423;letter-spacing:6px;margin-bottom:6px;font-weight:400}
#modalBox h4{margin:20px 0 8px;color:#5d4a22;letter-spacing:3px;border-left:4px solid var(--vermilion);padding-left:10px;font-size:16px}
#modalBox p,#modalBox div{font-size:14.5px;line-height:2.05;letter-spacing:.5px;color:#3c3120;text-align:justify}
#modalBox .closeRow{text-align:center;margin-top:22px}
#modalBox button{font-family:'Noto Serif TC',serif;background:#9c3222;color:#fff3e0;border:none;border-radius:8px;
  padding:9px 30px;font-size:14px;letter-spacing:3px;cursor:pointer}
@media (max-width:760px){
  .card h2{font-size:38px;letter-spacing:8px}
  .pickTitle{font-size:32px;letter-spacing:6px}
  #subs{padding-top:24px}
  #scrollTag{display:none}
}
</style>
</head>
<body>
<div id="progressWrap"><div id="progressBar"></div></div>
<header>
  <div class="brand">
    <div class="seal">古風</div>
    <div>
      <h1 id="hdTitle">古風動畫集</h1>
      <small id="hdSub">清代筆記・動畫說書</small>
    </div>
  </div>
  <div style="font-size:12px;color:#9a7a3a;letter-spacing:2px">水墨插畫・合成古琴配樂・語音旁白・全文字幕</div>
</header>

<div id="stageWrap">
  <div class="scrollWrap unroll" id="scrollWrap">
    <div class="roller left"></div>
    <div id="scrollTag">古風動畫集</div>
    <div class="mount">
      <div id="stage">
        <div class="art" id="artA"></div>
        <div class="art" id="artB"></div>
        <div id="vignette"></div><div id="grain"></div>
        <div id="chapterChip">序幕</div>
        <div id="subs" class="subIn"><div id="origLine"></div><div id="narrLine"></div></div>
        <div id="dots"></div>
        <div id="controls">
          <button class="btn" id="btnPrev">⏮ 上一幕</button>
          <button class="btn primary" id="btnPlay">▶ 播放</button>
          <button class="btn" id="btnNext">下一幕 ⏭</button>
          <div class="sep"></div>
          <button class="btn" id="btnPickCtl">⏏ 選篇</button>
          <div class="sep"></div>
          <button class="btn tog on" id="btnMusic">樂</button>
          <button class="btn tog on" id="btnVoice">聲</button>
          <button class="btn tog on" id="btnSubs">字</button>
          <div class="sep"></div>
          <button class="btn" id="btnText">📜 文本</button>
        </div>

        <!-- 選篇畫面（開頭） -->
        <div class="overlay" id="pickOverlay">
          <div class="pickWrap">
            <div class="pickTitle">古風動畫集</div>
            <div class="pickSub">清代筆記小說・水墨動畫說書・請擇篇觀賞</div>
            <div class="pickCards">
              <div class="pickCard">
                <h3>土地受餓</h3>
                <div class="src">清・袁枚《子不語》</div>
                <p>杭州書生張望齡病中見故鬼來訪，揭出一位操守清廉、終年挨餓的土地神。鬼界香火冷暖，正是人間官場縮影。</p>
                <button data-pick="0">開始觀賞</button>
              </div>
              <div class="pickCard">
                <h3>自污救人</h3>
                <div class="src">清・紀昀《閱微草堂筆記》</div>
                <p>農夫守瓜田，夜聞鬼語。村嫗為救蒙冤婢女，甘冒盜名自污認罪——一念之仁，感動冥籍，其子獲延壽養母。</p>
                <button data-pick="1">開始觀賞</button>
              </div>
            </div>
          </div>
        </div>

        <div class="overlay hidden" id="endOverlay">
          <div class="card">
            <h2>終</h2>
            <div class="sub" id="endQuote"></div>
            <p id="endPoem"></p>
            <button class="bigPlay" id="btnReplay">重新觀賞</button>
            <div class="endBtns">
              <button class="btn" id="btnPickEnd">⏏ 返回選篇</button>
              <button class="btn" id="btnText2">📜 閱讀原文與賞析</button>
            </div>
          </div>
        </div>

        <div id="modal">
          <div id="modalBox">
            <h3 id="mTitle"></h3>
            <h4>原文</h4>
            <div id="mOrig"></div>
            <h4>白話譯文</h4>
            <div id="mTrans"></div>
            <h4>作品介紹與賞析</h4>
            <div id="mIntro"></div>
            <div class="closeRow"><button id="btnCloseModal">掩卷</button></div>
          </div>
        </div>
      </div>
    </div>
    <div class="roller right"></div>
  </div>
</div>

<script>

 orig:"杭州錢塘邑生張望齡，病瘧。熱重時，見已故同學顧某者踉蹌而來，曰：「兄壽算已絕，幸幼年曾救一女，益壽一紀。前兄所救之女知兄病重，特來奉探，為地方鬼棍所詐，誣以平素有黯昧事。弟大加呵斥，方遣之去，特詣府奉賀。」張見故人為己事而來，衣裳藍縷，面有菜色，因謝以金。顧辭不受，曰：「我現為本處土地神，因官職小，地方清苦，我又素講操守，不肯擅受鬼詞，濫作威福，故終年無香火，雖作土地，往往受餓。然非分之財，雖故人見贈，我終不受。」張大笑。\n次日，具牲牢祭之，又夢顧來謝曰：「人得一飽，可耐三日；鬼得一飽，可耐一年。我受君恩，可挨到陰司大計，望薦卓異矣。」張問：「如此清官，何以不即升城隍？」曰：「解應酬者，可望格外超升；做清官者，只好大計卓薦。」",
 trans:"杭州錢塘縣有位秀才名叫張望齡，患上了瘧疾。發高燒最厲害的時候，他看見已經去世的同學顧某跌跌撞撞地走來，說道：「老兄的壽命本已到了盡頭，幸虧你幼年時救過一位女子，因此增壽十二年。先前你救的那位女子聽說你病重，特來探望，卻被地方上的無賴惡鬼訛詐，誣衊她平日有不可告人的醜事。我嚴厲地斥責了那惡鬼，才將他打發走。今日特地到府上向你道賀。」張望齡見老朋友為了自己的事而來，穿得破破爛爛、面黃肌瘦，便拿出銀錢感謝他。顧某推辭不肯接受，說：「我現在是本地的土地神，因為官職小，轄區清苦，我一向又講究操守，不肯擅自收受鬼魂的訴訟賄賂、濫用威權，所以整年沒有香火供奉。雖然當著土地神，卻常常挨餓。然而不屬於我應得的錢財，即使是老朋友贈送，我也絕不接受。」張望齡聽後大笑。\n第二天，他備辦牛羊祭品祭祀顧某，又夢見顧某前來道謝說：「人吃一頓飽飯，可以支撐三天；鬼吃一頓飽飯，可以支撐一年。我受了你的恩惠，可以一直撐到陰間的大考績，盼望能獲得『卓異』的評定推薦。」張望齡問：「像你這樣的清官，為什麼不馬上提拔為城隍呢？」顧某說：「善於應酬鑽營的，才有可能破格超升；做清官的，只能等到考績時被推薦為『卓異』罷了。」",
 intro:"袁枚（1716–1797），字子才，號簡齋、隨園老人，清代著名詩人、文學家，辭官後隱居南京隨園，世稱隨園先生。《子不語》是其文言筆記小說集，書名取自《論語・述而》「子不語怪、力、亂、神」，專記鬼神奇談、民間異聞，與紀昀《閱微草堂筆記》、蒲松齡《聊齋志異》並稱清代志怪筆記之代表作。\n〈土地受餓〉篇幅雖短，構思極妙。土地神是民間信仰中最基層的神祇，一如人間最基層的小吏。顧某為神而堅守操守，不受鬼詞、不濫威福，結果「終年無香火，往往受餓」；反觀人間官場，逢迎鑽營者飛黃騰達，清正廉明者沉淪下僚。結尾「解應酬者，可望格外超升；做清官者，只好大計卓薦」一句，以陰間映襯陽世，冷雋犀利，是袁枚諷世筆記的點睛之筆。文中「人得一飽，可耐三日；鬼得一飽，可耐一年」亦成妙語，讀之令人失笑，笑後復生感慨。"

let AC=null,master,musicBus,sfxBus,musicOn=true,voiceOn=true,melTimer=null;
function initAudio(){
 if(AC) return;
 AC=new (window.AudioContext||window.webkitAudioContext)();
 master=AC.createGain(); master.gain.value=.9;
 const comp=AC.createDynamicsCompressor();
 master.connect(comp); comp.connect(AC.destination);
 musicBus=AC.createGain(); musicBus.gain.value=.5; musicBus.connect(master);
 sfxBus=AC.createGain(); sfxBus.gain.value=.8; sfxBus.connect(master);

}
function pluck(freq,t,vel,dur){
 const o=AC.createOscillator();o.type="triangle";
 const o2=AC.createOscillator();o2.type="sine";o2.frequency.value=freq*2.003;
 const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=freq*3.2;f.Q.value=1;
 const g=AC.createGain(),g2=AC.createGain();
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(vel*.16,t+.008);g2.gain.exponentialRampToValueAtTime(.001,t+dur*.5);
 o.frequency.value=freq;o.connect(f);f.connect(g);g.connect(musicBus);
 o2.connect(g2);g2.connect(musicBus);
 o.start(t);o2.start(t);o.stop(t+dur+.1);o2.stop(t+dur+.1);
}
const SCALE=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99];
let lastNote=4;
function scheduleMelody(){
 if(!AC)return;
 if(musicOn&&AC.state==="running"){
  const t=AC.currentTime+.06;
  lastNote=Math.max(0,Math.min(SCALE.length-1,lastNote+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)]));
  pluck(SCALE[lastNote],t,.16+Math.random()*.12,2.6);
  if(Math.random()<.34){const n2=Math.max(0,Math.min(SCALE.length-1,lastNote+(Math.random()<.5?-1:1)));
   pluck(SCALE[n2],t+.42,.1,2.2);}
  if(Math.random()<.18) pluck(SCALE[0]/2,t+.2,.1,3.4);
 }
 melTimer=setTimeout(scheduleMelody,1300+Math.random()*1900);
}
function startDrone(){
 const o=AC.createOscillator();o.type="sine";o.frequency.value=65.4;
 const g=AC.createGain();g.gain.value=.05;
 const lfo=AC.createOscillator();lfo.frequency.value=.07;
 const lg=AC.createGain();lg.gain.value=.022;
 lfo.connect(lg);lg.connect(g.gain);
 o.connect(g);g.connect(musicBus);o.start();lfo.start();
}
function startWind(){
 const len=2*AC.sampleRate,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
 for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
 const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=330;
 const g=AC.createGain();g.gain.value=.016;
 const lfo=AC.createOscillator();lfo.frequency.value=.05;
 const lg=AC.createGain();lg.gain.value=130;
 lfo.connect(lg);lg.connect(f.frequency);
 src.connect(f);f.connect(g);g.connect(musicBus);src.start();lfo.start();
}
function bell(){
 if(!AC||!musicOn)return;const t=AC.currentTime;
 [523.25,1046.5,1568].forEach((fr,i)=>{
  const o=AC.createOscillator();o.type="sine";o.frequency.value=fr;
  const g=AC.createGain();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09/(i+1),t+.01);
  g.gain.exponentialRampToValueAtTime(.0004,t+2.4);
  o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+2.5);});
}
function duck(on){
 if(!AC)return;
 musicBus.gain.setTargetAtTime(on?.14:.5,AC.currentTime,.35);
}

/* ================= 語音 ================= */
let zhVoice=null;
function pickVoice(){
 if(!("speechSynthesis" in window))return;
 const vs=speechSynthesis.getVoices();
 zhVoice=vs.find(v=>/zh[-_](TW|Hant)/i.test(v.lang))
      ||vs.find(v=>/zh[-_]CN/i.test(v.lang))
      ||vs.find(v=>/zh/i.test(v.lang))||null;
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text){
 if(!voiceOn||!("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 if(zhVoice)u.voice=zhVoice;
 u.lang=(zhVoice&&zhVoice.lang)||"zh-TW";
 u.rate=.95;u.pitch=1;u.volume=1;
 u.onstart=()=>duck(true);u.onend=()=>duck(false);u.onerror=()=>duck(false);
 speechSynthesis.speak(u);
}

/* ================= 播放器 ================= */
let idx=0,playing=false,pausedFlag=false,advanceTO=null,sceneStart=0,remaining=0,ended=false;
function dur(s){return Math.max(5600,s.narr.length*345+2400);}
function showArt(i){
 back.innerHTML=curStory.art[i];
 back.classList.add("on");front.classList.remove("on");
 const t=front;front=back;back=t;
}
function showScene(i){
 idx=Math.max(0,Math.min(curStory.scenes.length-1,i));
 ended=false;
 const s=curStory.scenes[idx];
 showArt(idx);
 chip.textContent=s.chip;
 origLine.textContent="「"+s.orig+"」";
 narrLine.textContent=s.narr;
 subs.classList.remove("subIn");void subs.offsetWidth;subs.classList.add("subIn");
 dots.forEach((d,k)=>d.classList.toggle("on",k===idx));
 progressBar.style.width=((idx)/(curStory.scenes.length-1)*100)+"%";
 bell();
}
function playCurrent(){
 clearTimeout(advanceTO);
 const s=curStory.scenes[idx];
 remaining=dur(s);sceneStart=Date.now();
 speak(s.narr);
 advanceTO=setTimeout(()=>{ if(idx<curStory.scenes.length-1){showScene(idx+1);playCurrent();} else finish(); },remaining);
}
function finish(){
 playing=false;pausedFlag=false;ended=true;
 btnPlay.textContent="▶ 重播";
 if("speechSynthesis" in window)speechSynthesis.cancel();
 duck(false);
 $("endQuote").textContent=curStory.endQuote;
 $("endPoem").innerHTML=curStory.endPoem;
 $("endOverlay").classList.remove("hidden");
}
function play(){
 if(ended){$("endOverlay").classList.add("hidden");showScene(0);}
 playing=true;pausedFlag=false;btnPlay.textContent="⏸ 暫停";
 if(AC&&AC.state==="suspended")AC.resume();
 playCurrent();
}
function pause(){
 playing=false;pausedFlag=true;btnPlay.textContent="▶ 播放";
 clearTimeout(advanceTO);remaining-=Date.now()-sceneStart;
 if("speechSynthesis" in window)speechSynthesis.pause();
 if(AC)musicBus.gain.setTargetAtTime(.06,AC.currentTime,.2);
}
function resume(){
 playing=true;pausedFlag=false;btnPlay.textContent="⏸ 暫停";
 sceneStart=Date.now();
 if("speechSynthesis" in window)speechSynthesis.resume();
 if(AC)musicBus.gain.setTargetAtTime(.5,AC.currentTime,.3);
 advanceTO=setTimeout(()=>{ if(idx<curStory.scenes.length-1){showScene(idx+1);playCurrent();} else finish(); },Math.max(1200,remaining));
}
function jump(i){
 $("endOverlay").classList.add("hidden");ended=false;
 clearTimeout(advanceTO);
 if("speechSynthesis" in window){speechSynthesis.cancel();speechSynthesis.resume();}
 showScene(i);
 if(playing)playCurrent();
 else{remaining=dur(curStory.scenes[i]);sceneStart=Date.now();}
}
/* ===== 選篇與重置 ===== */
function stopAll(){
 clearTimeout(advanceTO);
 if("speechSynthesis" in window){speechSynthesis.cancel();speechSynthesis.resume();}
 playing=false;pausedFlag=false;ended=false;
 btnPlay.textContent="▶ 播放";
 $("endOverlay").classList.add("hidden");
 $("modal").classList.remove("show");
 if(AC)musicBus.gain.setTargetAtTime(musicOn?.5:0,AC.currentTime,.3);
 duck(false);
}
function startStory(i){
 initAudio();pickVoice();
 if(AC&&AC.state==="suspended")AC.resume();
 storyIdx=i;curStory=STORIES[i];
 $("hdTitle").textContent=curStory.name;
 $("hdSub").textContent=curStory.source+"・古風動畫說書";
 scrollTag.textContent=curStory.name;
 buildDots();
 $("pickOverlay").classList.add("hidden");
 playUnroll();
 showScene(0);play();
}
function toPick(){
 stopAll();
 $("hdTitle").textContent="古風動畫集";
 $("hdSub").textContent="清代筆記・動畫說書";
 scrollTag.textContent="古風動畫集";
 showScene(0);progressBar.style.width="0%";
 $("pickOverlay").classList.remove("hidden");
 playUnroll();
}

/* ================= 事件綁定 ================= */
document.querySelectorAll("[data-pick]").forEach(b=>{
 b.onclick=()=>startStory(parseInt(b.dataset.pick,10));
});
btnPlay.onclick=()=>{ if(playing)pause(); else if(pausedFlag)resume(); else play(); };
$("btnPrev").onclick=()=>jump(idx-1);
$("btnNext").onclick=()=>jump(idx+1);
$("btnReplay").onclick=()=>{$("endOverlay").classList.add("hidden");jump(0);play();};
$("btnPickEnd").onclick=toPick;
$("btnPickCtl").onclick=toPick;
$("btnMusic").onclick=function(){
 musicOn=!musicOn;this.classList.toggle("on",musicOn);
 if(AC)musicBus.gain.setTargetAtTime(musicOn?.5:0,AC.currentTime,.25);
};
$("btnVoice").onclick=function(){
 voiceOn=!voiceOn;this.classList.toggle("on",voiceOn);
 if(!voiceOn&&"speechSynthesis" in window){speechSynthesis.cancel();duck(false);}
 else if(voiceOn&&playing)speak(curStory.scenes[idx].narr);
};
$("btnSubs").onclick=function(){
 document.body.classList.toggle("noSubs");
 this.classList.toggle("on",!document.body.classList.contains("noSubs"));
};
function openModal(){
 $("mTitle").textContent=curStory.name;
 $("mOrig").innerText=curStory.modal.orig;
 $("mTrans").innerText=curStory.modal.trans;
 $("mIntro").innerText=curStory.modal.intro;
 $("modal").classList.add("show");
}
$("btnText").onclick=openModal;
$("btnText2").onclick=openModal;
$("btnCloseModal").onclick=()=>$("modal").classList.remove("show");
$("modal").onclick=e=>{if(e.target.id==="modal")$("modal").classList.remove("show");};
window.addEventListener("keydown",e=>{
 if(e.code==="Space"){e.preventDefault();btnPlay.click();}
 if(e.code==="ArrowRight")jump(idx+1);
 if(e.code==="ArrowLeft")jump(idx-1);
 if(e.code==="Home"){e.preventDefault();toPick();}
});
/* 初始 */
buildDots();
showScene(0);
progressBar.style.width="0%";
</script>
</body>
